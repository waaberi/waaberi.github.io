<header class="profile">
  {{ if .IsHome }}
    <h1 class="name">Waaberi<br>Ibrahim</h1>
  {{ else }}
    <p class="name"><a href="{{ .Site.Home.RelPermalink }}" aria-label="Waaberi Ibrahim — {{ .Site.Home.Params.homeLabel }}">Waaberi<br>Ibrahim</a></p>
  {{ end }}
  <div class="bio">{{ .Site.Home.Content }}</div>
  {{ with .Site.GetPage "/blog" }}
    <nav class="site-nav" aria-label="{{ $.Site.Home.Params.navigationLabel }}">
      <a href="{{ .RelPermalink }}"{{ if eq $.Section "blog" }} aria-current="{{ if $.IsSection }}page{{ else }}location{{ end }}"{{ end }}>{{ .Title }} <span aria-hidden="true">→</span></a>
    </nav>
  {{ end }}
  <nav class="contact" aria-label="{{ .Site.Home.Params.contactLabel }}">
    <ul>
      <li><a href="{{ .Site.Params.github }}">GitHub <span class="arrow" aria-hidden="true">↗</span></a></li>
      <li><a href="{{ .Site.Params.linkedin }}">LinkedIn <span class="arrow" aria-hidden="true">↗</span></a></li>
      <li><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Home.Params.emailLabel }} <span class="arrow" aria-hidden="true">↗</span></a></li>
      <li><a href="{{ .Site.Home.Params.resume | relURL }}">{{ .Site.Home.Params.resumeLabel }} <span class="arrow" aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
  <div class="preferences">
    <div class="theme-control" hidden>
      <label for="theme-select">{{ .Site.Home.Params.themeLabel }}</label>
      <select id="theme-select" name="theme">
        <option value="system">{{ .Site.Home.Params.systemThemeLabel }}</option>
        <option value="light">{{ .Site.Home.Params.lightThemeLabel }}</option>
        <option value="dark">{{ .Site.Home.Params.darkThemeLabel }}</option>
      </select>
    </div>
  </div>
</header>
