{{ $page := . }}
<nav class="languages" aria-label="{{ .Site.Home.Params.languageLabel }}">
  <ul>
    {{ range hugo.Sites }}
      {{ $language := .Language.Lang }}
      {{ $target := .Home }}
      {{ range $page.AllTranslations }}
        {{ if eq .Language.Lang $language }}{{ $target = . }}{{ end }}
      {{ end }}
      <li>
        <a href="{{ $target.RelPermalink }}" lang="{{ $language }}" hreflang="{{ $language }}" aria-label="{{ .Language.Label }}"{{ if eq $page.Language.Lang $language }} aria-current="page"{{ end }}>{{ upper $language }}</a>
      </li>
    {{ end }}
  </ul>
</nav>
